<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bg)" />

  <!-- Title Area -->
  <text x="480" y="44" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle">
    银行流水「余额链断裂」穿帮死穴对比
  </text>
  <text x="480" y="70" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    基于相邻交易恒等式：上一笔余额 ± 本笔发生额 = 本笔期末余额
  </text>

  <!-- Left Card: Clean Balance Chain -->
  <g transform="translate(40, 95)" filter="url(#shadow)">
    <rect width="425" height="410" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
    <rect width="425" height="42" rx="12" fill="#10b981" fill-opacity="0.15" />
    <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#34d399">
      🟢 正常流水：余额链严密闭环
    </text>

    <!-- Row 1 -->
    <g transform="translate(20, 65)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#94a3b8">2026-08-10 · 期初基准</text>
      <text x="385" y="0" font-family="monospace" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="end">15,200.00</text>
    </g>
    <line x1="20" y1="85" x2="405" y2="85" stroke="#334155" stroke-width="1" />

    <!-- Row 2 -->
    <g transform="translate(20, 115)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#94a3b8">2026-08-15 · 工资入账</text>
      <text x="210" y="0" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">+8,500.00</text>
      <text x="385" y="0" font-family="monospace" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="end">23,700.00</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#10b981">
        ✓ 15,200.00 + 8,500.00 = 23,700.00
      </text>
    </g>
    <line x1="20" y1="150" x2="405" y2="150" stroke="#334155" stroke-width="1" />

    <!-- Row 3 -->
    <g transform="translate(20, 180)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#94a3b8">2026-08-20 · 房租转账</text>
      <text x="210" y="0" font-family="monospace" font-size="13" font-weight="700" fill="#f87171">-3,200.00</text>
      <text x="385" y="0" font-family="monospace" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="end">20,500.00</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#10b981">
        ✓ 23,700.00 - 3,200.00 = 20,500.00
      </text>
    </g>
    <line x1="20" y1="215" x2="405" y2="215" stroke="#334155" stroke-width="1" />

    <!-- Row 4 -->
    <g transform="translate(20, 245)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#94a3b8">2026-08-28 · 超市消费</text>
      <text x="210" y="0" font-family="monospace" font-size="13" font-weight="700" fill="#f87171">-500.00</text>
      <text x="385" y="0" font-family="monospace" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="end">20,000.00</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#10b981">
        ✓ 20,500.00 - 500.00 = 20,000.00
      </text>
    </g>

    <!-- Bottom summary -->
    <rect x="20" y="325" width="385" height="60" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" />
    <text x="212" y="350" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">
      全部交易逐笔吻合 · 恒等式 100% 成立
    </text>
    <text x="212" y="370" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
      银行批量报表系统一次性记账导出特征
    </text>
  </g>

  <!-- Right Card: Tampered Balance Chain -->
  <g transform="translate(495, 95)" filter="url(#shadow)">
    <rect width="425" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.7" />
    <rect width="425" height="42" rx="12" fill="#ef4444" fill-opacity="0.18" />
    <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="700" fill="#f87171">
      🚨 篡改流水：涂改一笔，整条链崩塌
    </text>

    <!-- Row 1 -->
    <g transform="translate(20, 65)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#94a3b8">2026-08-10 · 期初基准</text>
      <text x="385" y="0" font-family="monospace" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="end">15,200.00</text>
    </g>
    <line x1="20" y1="85" x2="405" y2="85" stroke="#334155" stroke-width="1" />

    <!-- Row 2 (Tampered) -->
    <g transform="translate(20, 115)">
      <rect x="-6" y="-16" width="397" height="45" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 2" />
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#fca5a5">2026-08-15 · 工资【涂改】</text>
      <text x="210" y="0" font-family="monospace" font-size="13" font-weight="800" fill="#f87171">+28,500.00</text>
      <text x="385" y="0" font-family="monospace" font-size="14" font-weight="800" fill="#fbbf24" text-anchor="end">43,700.00</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#f87171">
        ⚠️ 涂改入账: 8,500 → 28,500, 期末相应改成 43,700
      </text>
    </g>
    <line x1="20" y1="165" x2="405" y2="165" stroke="#334155" stroke-width="1" />

    <!-- Row 3 (Broken) -->
    <g transform="translate(20, 195)">
      <rect x="-6" y="-16" width="397" height="48" rx="6" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="1.5" />
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#fca5a5">2026-08-20 · 房租转账</text>
      <text x="210" y="0" font-family="monospace" font-size="13" font-weight="700" fill="#f87171">-3,200.00</text>
      <text x="385" y="0" font-family="monospace" font-size="14" font-weight="800" fill="#f87171" text-anchor="end">20,500.00 ❌</text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5" font-weight="800" fill="#fca5a5">
        💥 穿帮！43,700 - 3,200 应为 40,500 (漏改差额 2万!)
      </text>
    </g>
    <line x1="20" y1="250" x2="405" y2="250" stroke="#334155" stroke-width="1" />

    <!-- Row 4 -->
    <g transform="translate(20, 275)">
      <text x="0" y="0" font-family="monospace" font-size="12" fill="#94a3b8">2026-08-28 · 超市消费</text>
      <text x="210" y="0" font-family="monospace" font-size="13" font-weight="700" fill="#f87171">-500.00</text>
      <text x="385" y="0" font-family="monospace" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="end">20,000.00</text>
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#f59e0b">
        ⚠️ 沿用旧余额链，整表数据逻辑全线失真
      </text>
    </g>

    <!-- Bottom summary -->
    <rect x="20" y="325" width="385" height="60" rx="8" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.4" />
    <text x="212" y="350" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">
      造假者改单笔进账 · 漏改后续整条余额链
    </text>
    <text x="212" y="370" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
      程序自动相邻行运算，1 秒即可定位算术断裂
    </text>
  </g>
</svg>