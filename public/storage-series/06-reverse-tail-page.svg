<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="aR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="aG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">后半段页码：从另一头数过来</text>
  <text x="480" y="60" text-anchor="middle" font-size="12.5" fill="#57606a">示意：满足条件共 total = 100,000 行，每页 10 条，用户点「尾页」（第 10000 页，offset = 99,990）</text>

  <text x="60" y="108" font-size="12.5" font-weight="700" fill="#57606a">最新（DESC 起点）</text>
  <text x="900" y="108" text-anchor="end" font-size="12.5" font-weight="700" fill="#57606a">最老（ASC 起点）</text>
  <rect x="60" y="118" width="840" height="40" rx="4" fill="#eaeef2" stroke="#8c959f"/>
  <rect x="880" y="118" width="20" height="40" fill="#1a7f37"/>
  <line x1="480" y1="112" x2="480" y2="166" stroke="#8250df" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="480" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#8250df">total / 2：翻转分界线</text>
  <text x="890" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="#1a7f37">要的 10 行</text>

  <line x1="62" y1="212" x2="872" y2="212" stroke="#cf222e" stroke-width="3" marker-end="url(#aR)"/>
  <text x="80" y="236" font-size="13" font-weight="700" fill="#cf222e">DESC + LIMIT 99990, 10：先扫过 99,990 个索引项再取 10 个</text>

  <line x1="898" y1="262" x2="884" y2="262" stroke="#1a7f37" stroke-width="3" marker-end="url(#aG)"/>
  <text x="870" y="286" text-anchor="end" font-size="13" font-weight="700" fill="#1a7f37">ASC + LIMIT 0, 10：几乎不用跳</text>

  <rect x="60" y="310" width="400" height="140" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="80" y="336" font-size="13.5" font-weight="700" fill="#1f2328">换算公式</text>
  <text x="80" y="362" font-size="12.5" fill="#1f2328">ascLimit  = min(pageSize, total − offset)</text>
  <text x="80" y="386" font-size="12.5" fill="#1f2328">ascOffset = total − offset − ascLimit</text>
  <text x="80" y="410" font-size="12.5" fill="#1f2328">外层再按 DESC 排回来（只排 10 行）</text>
  <text x="80" y="434" font-size="12" fill="#57606a">最后一页不满 10 条时，ascLimit 自动变小</text>

  <rect x="490" y="310" width="410" height="140" rx="8" fill="#fff8c5" stroke="#bf8700"/>
  <text x="510" y="336" font-size="13.5" font-weight="700" fill="#7d4e00">代价与边界</text>
  <text x="510" y="362" font-size="12.5" fill="#1f2328">• 需要先知道 total，多一次 COUNT</text>
  <text x="510" y="386" font-size="12.5" fill="#1f2328">• 最坏情况变成正中间那页：扫描量减半，</text>
  <text x="510" y="406" font-size="12.5" fill="#1f2328">  不是消失</text>
  <text x="510" y="430" font-size="12.5" fill="#1f2328">• COUNT 与取数之间数据不能变（T-1 只读成立）</text>
</svg>
