<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" style="background:#ffffff;font-family:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">千万级 ~ 亿级台账存储选型决策树</text>
  <text x="480" y="54" text-anchor="middle" font-size="12.5" fill="#57606a">先按「数据结构」做轻重分离，再按「有无必传主 ID」「并发量级」「数据行数」逐层收敛</text>

  <!-- Root -->
  <rect x="350" y="72" width="260" height="40" rx="20" fill="#1f2328"/>
  <text x="480" y="97" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">业务数据存储需求入口</text>

  <!-- Root split lines -->
  <path d="M 480 112 L 480 132 L 285 132 L 285 152" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 480 112 L 480 132 L 775 132 L 775 152" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Branch Left: Structured List -->
  <rect x="135" y="156" width="300" height="44" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="285" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#0969da">结构化列表数据（几十~几百 B/行）</text>
  <text x="285" y="192" text-anchor="middle" font-size="11" fill="#24292f">需要多条件筛选、排序、分页、导出</text>

  <!-- Branch Right: Heavy Payload -->
  <rect x="635" y="156" width="280" height="44" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="775" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f37">重报文 / 详情（几 KB ~ MB 级）</text>
  <text x="775" y="192" text-anchor="middle" font-size="11" fill="#24292f">仅按业务单号点查或下载，无筛选需求</text>

  <!-- Right sub-decision -->
  <line x1="775" y1="200" x2="775" y2="232" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="655" y="236" width="240" height="44" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.3"/>
  <text x="775" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">单条体积 &lt;= 256KB 且需</text>
  <text x="775" y="272" text-anchor="middle" font-size="11.5" fill="#1f2328">高并发点查 / 批量 mSet / TTL？</text>

  <path d="M 709 280 L 709 326" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="694" y="294" width="30" height="18" rx="4" fill="#ffffff"/>
  <text x="709" y="307" text-anchor="middle" font-size="11" font-weight="700" fill="#1a7f37">是</text>

  <path d="M 840 280 L 840 303 L 870 303 L 870 326" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="802" y="292" width="112" height="18" rx="4" fill="#ffffff"/>
  <text x="858" y="305" text-anchor="middle" font-size="10.5" font-weight="700" fill="#bc4c00">否(&gt;256KB/归档)</text>

  <!-- Right leaves -->
  <rect x="630" y="330" width="158" height="86" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="709" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#1a7f37">分布式 KV</text>
  <text x="709" y="370" text-anchor="middle" font-size="11" fill="#1f2328">（RocksDB / LSM）</text>
  <text x="709" y="388" text-anchor="middle" font-size="10.5" fill="#57606a">0.2ms 亚毫秒点查</text>
  <text x="709" y="404" text-anchor="middle" font-size="10.5" fill="#57606a">离线灌数须限速 QPS</text>

  <rect x="802" y="330" width="136" height="86" rx="8" fill="#fff8f2" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="870" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#bc4c00">对象存储 OSS</text>
  <text x="870" y="370" text-anchor="middle" font-size="11" fill="#1f2328">海量 / 最低成本</text>
  <text x="870" y="388" text-anchor="middle" font-size="10.5" fill="#57606a">单对象 MB~GB 级</text>
  <text x="870" y="404" text-anchor="middle" font-size="10.5" fill="#57606a">小文件须打包合并</text>

  <!-- Left sub-decision 1: Mandatory Main ID? -->
  <line x1="285" y1="200" x2="285" y2="232" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="145" y="236" width="280" height="44" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.3"/>
  <text x="285" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">每次查询是否必带主 ID（如 userId）？</text>
  <text x="285" y="272" text-anchor="middle" font-size="11" fill="#57606a">例如 C 端「我的订单」vs 后台全局台账</text>

  <!-- Yes -> Key-List / Sharded MySQL -->
  <path d="M 195 280 L 195 304 L 106 304 L 106 326" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="52" y="294" width="102" height="18" rx="4" fill="#ffffff"/>
  <text x="103" y="307" text-anchor="middle" font-size="11" font-weight="700" fill="#8250df">是（必带主 ID）</text>

  <rect x="24" y="330" width="164" height="106" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="106" y="352" text-anchor="middle" font-size="13" font-weight="700" fill="#8250df">分布式 Key-List</text>
  <text x="106" y="370" text-anchor="middle" font-size="11" fill="#1f2328">（或 MySQL 按主 ID 分表）</text>
  <text x="106" y="390" text-anchor="middle" font-size="10.5" fill="#57606a">单主 ID 下挂数千条子项</text>
  <text x="106" y="406" text-anchor="middle" font-size="10.5" fill="#57606a">时用 Key-List + KV 回表</text>
  <text x="106" y="422" text-anchor="middle" font-size="10.5" fill="#57606a">抗超高 C 端并发</text>

  <!-- No -> Global Multi-Condition Query -->
  <path d="M 361 280 L 361 326" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="292" y="294" width="144" height="18" rx="4" fill="#ffffff"/>
  <text x="364" y="307" text-anchor="middle" font-size="11" font-weight="700" fill="#0969da">否（全条件可选）</text>

  <rect x="218" y="330" width="286" height="46" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.3"/>
  <text x="361" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2328">并发量级与检索特征？</text>
  <text x="361" y="367" text-anchor="middle" font-size="11" fill="#57606a">区分「万人公网/模糊搜索」vs「内部低并发后台」</text>

  <!-- Split to ES vs Internal (MySQL & TiDB) -->
  <path d="M 290 376 L 290 406 L 162 406 L 162 442" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="92" y="396" width="148" height="18" rx="4" fill="#ffffff"/>
  <text x="166" y="409" text-anchor="middle" font-size="10.5" font-weight="700" fill="#bc4c00">高并发 / 模糊 / 多维聚合</text>

  <path d="M 435 376 L 435 406 L 475 406 L 475 442" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 435 406 L 791 406 L 791 442" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="520" y="396" width="222" height="18" rx="4" fill="#ffffff"/>
  <text x="631" y="409" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0969da">低并发后台 + 任意翻页（按 2 年行数）</text>

  <!-- ES Leaf -->
  <rect x="24" y="446" width="276" height="94" rx="8" fill="#ffedd5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="162" y="468" text-anchor="middle" font-size="13.5" font-weight="700" fill="#bc4c00">Elasticsearch</text>
  <text x="162" y="488" text-anchor="middle" font-size="11.5" fill="#1f2328">倒排 + BKD 树 + Roaring Bitmap 位图交集</text>
  <text x="162" y="507" text-anchor="middle" font-size="11" fill="#57606a">• 扛高并发任意组合条件、文本 LIKE 模糊检索</text>
  <text x="162" y="525" text-anchor="middle" font-size="11" fill="#cf222e">• 交互须砍掉精确 COUNT 与跳尾页（改游标）</text>

  <!-- Internal Split: MySQL vs TiDB -->
  <rect x="330" y="446" width="290" height="94" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="475" y="468" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0969da">单机 MySQL（≤ 3000~5000 万行）</text>
  <text x="475" y="488" text-anchor="middle" font-size="11.5" fill="#1f2328">宽覆盖索引（时间+id放前2列）+ 延迟关联 + 尾页反转</text>
  <text x="475" y="507" text-anchor="middle" font-size="11" fill="#1a7f37">• 零新组件、最低运维成本、支持任意跳尾页（&lt;100ms）</text>
  <text x="475" y="525" text-anchor="middle" font-size="11" fill="#57606a">• 导出走 (time, id) 游标分页，大报文剥离</text>

  <rect x="644" y="446" width="294" height="94" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="791" y="468" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1a7f37">TiDB（&gt; 5000 万 ~ 数亿行）</text>
  <text x="791" y="488" text-anchor="middle" font-size="11.5" fill="#1f2328">计算存储分离 + 全局二级索引（无需分表键）</text>
  <text x="791" y="507" text-anchor="middle" font-size="11" fill="#1a7f37">• 兼容 MySQL 协议，自动分裂 Region 水平扩容</text>
  <text x="791" y="525" text-anchor="middle" font-size="11" fill="#57606a">• 多节点下推并行扫描，需改用 AUTO_RANDOM 主键</text>
</svg>
